<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Inter, Helvetica, Arial, sans-serif">
  <title>How Andy works: what runs in the house, and what goes to the cloud</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4252"/>
    </marker>
    <marker id="arrow-cloud" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b4541a"/>
    </marker>
  </defs>
  <style>
    .title { font-size: 34px; font-weight: 700; fill: #1d2330; }
    .sub { font-size: 19px; fill: #4c566a; }
    .h { font-size: 21px; font-weight: 700; fill: #1d2330; }
    .t { font-size: 16.5px; fill: #2e3440; }
    .s { font-size: 14.5px; fill: #4c566a; }
    .meta { font-size: 13px; font-weight: 700; fill: #0b5cad; letter-spacing: 0.04em; }
    .other { font-size: 13px; font-weight: 700; fill: #6b7280; letter-spacing: 0.04em; }
    .lab { font-size: 15px; fill: #3b4252; }
    .labc { font-size: 15px; fill: #b4541a; font-weight: 700; }
    .house { font-size: 17px; font-weight: 700; fill: #2f6f4f; letter-spacing: 0.06em; }
    .cloudh { font-size: 17px; font-weight: 700; fill: #b4541a; letter-spacing: 0.06em; }
  </style>

  <rect width="1600" height="900" fill="#f7f8fa"/>
  <text x="48" y="62" class="title">How Andy works</text>
  <text x="48" y="94" class="sub">Pictures and voice stay in the house. The cloud gets words, and only when it's needed.</text>

  <!-- The house -->
  <rect x="32" y="122" width="1150" height="748" rx="22" fill="#eef6f1" stroke="#2f6f4f" stroke-width="2.5" stroke-dasharray="10 7"/>
  <text x="56" y="156" class="house">THE HOUSE</text>

  <!-- The room: robot, person, TV -->
  <rect x="56" y="178" width="250" height="326" rx="16" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/>
  <text x="76" y="212" class="h">Reachy Mini Lite</text>
  <text x="76" y="242" class="t">camera</text>
  <text x="76" y="268" class="t">four microphones</text>
  <text x="76" y="294" class="t">speaker</text>
  <text x="76" y="320" class="t">head (6 axes), base</text>
  <text x="76" y="346" class="t">antennas</text>
  <line x1="76" y1="368" x2="286" y2="368" stroke="#e1e6ed"/>
  <text x="76" y="396" class="s">Turns to your voice, looks,</text>
  <text x="76" y="418" class="s">and points at what it found.</text>
  <text x="76" y="452" class="s">Moves only by checked angles:</text>
  <text x="76" y="474" class="s">models never send motor values.</text>

  <rect x="56" y="530" width="250" height="314" rx="16" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/>
  <text x="76" y="564" class="h">The TV</text>
  <text x="76" y="594" class="t">what Andy saw, outlined</text>
  <text x="76" y="620" class="t">the plan, step by step</text>
  <text x="76" y="646" class="t">the time it took</text>
  <text x="76" y="672" class="t">answers with sources</text>
  <text x="76" y="698" class="t">which models worked</text>
  <line x1="76" y1="720" x2="286" y2="720" stroke="#e1e6ed"/>
  <text x="76" y="748" class="h" style="font-size:17px">The privacy receipt</text>
  <text x="76" y="774" class="s">every turn: which words went</text>
  <text x="76" y="796" class="s">to which cloud model, or</text>
  <text x="76" y="818" class="s">"Nothing left this house"</text>

  <!-- The computer beside the robot -->
  <rect x="350" y="178" width="808" height="666" rx="18" fill="#ffffff" stroke="#9aa5b4" stroke-width="2"/>
  <text x="374" y="214" class="h">The computer beside the robot</text>
  <text x="374" y="240" class="s">two RTX 3090s · every model here is served on 127.0.0.1 only</text>

  <!-- Safety first -->
  <rect x="374" y="260" width="372" height="118" rx="12" fill="#fff5f5" stroke="#e8b4b4"/>
  <text x="392" y="290" class="h" style="font-size:18px">Safety first, before any model</text>
  <text x="392" y="318" class="t">crisis words → the 988 line, from code</text>
  <text x="392" y="344" class="t">then Llama Guard 3 8B, a second check</text>
  <text x="392" y="366" class="meta">META OPEN WEIGHTS · GPU 1</text>

  <!-- Hearing and speaking -->
  <rect x="764" y="260" width="372" height="118" rx="12" fill="#f5f8ff" stroke="#b9c8e6"/>
  <text x="782" y="290" class="h" style="font-size:18px">Hearing and speaking</text>
  <text x="782" y="318" class="t">Omnilingual ASR: English, Spanish</text>
  <text x="782" y="344" class="t">Kokoro-82M: Andy's voice</text>
  <text x="782" y="366" class="meta">META OPEN WEIGHTS</text><text x="960" y="366" class="other">+ KOKORO · GPU 1</text>

  <!-- Seeing -->
  <rect x="374" y="396" width="372" height="170" rx="12" fill="#f5f8ff" stroke="#b9c8e6"/>
  <text x="392" y="426" class="h" style="font-size:18px">Seeing</text>
  <text x="392" y="454" class="t">SAM 3.1: finds the thing; its mask</text>
  <text x="392" y="478" class="t">becomes the head's angle, then checked</text>
  <text x="392" y="504" class="t">Object Multiplex: every cup at once</text>
  <text x="392" y="530" class="t">DINOv2: "my mug" · MapAnything: how far</text>
  <text x="392" y="554" class="meta">META OPEN WEIGHTS · GPU 1</text>

  <!-- Thinking -->
  <rect x="764" y="396" width="372" height="170" rx="12" fill="#f5f8ff" stroke="#b9c8e6"/>
  <text x="782" y="426" class="h" style="font-size:18px">Thinking, offline too</text>
  <text x="782" y="454" class="t">Muse Glimmer 30B (llama.cpp):</text>
  <text x="782" y="478" class="t">conversation, search plans offline,</text>
  <text x="782" y="504" class="t">"is that a picture on a screen?",</text>
  <text x="782" y="530" class="t">what it sees, Spanish translation</text>
  <text x="782" y="554" class="meta">META OPEN WEIGHTS · GPU 0</text>

  <!-- Andy's code -->
  <rect x="374" y="584" width="762" height="142" rx="12" fill="#f3f4f6" stroke="#cfd5de"/>
  <text x="392" y="614" class="h" style="font-size:18px">Andy's code: the agent's tools, checked</text>
  <text x="392" y="642" class="t">look · compare · point · follow · keep an eye on · remind · draw · show on the TV</text>
  <text x="392" y="668" class="t">every argument checked; named views and numbered places, never motor values; ten looks at most</text>
  <text x="392" y="694" class="t">memory in words ("on the desk, behind the keyboard"), never a picture · a hard cap on spend</text>
  <text x="392" y="716" class="s">Andy's words are built from what the tools did, never from a model's guess.</text>

  <!-- Web -->
  <rect x="374" y="744" width="762" height="82" rx="12" fill="#f5f8ff" stroke="#b9c8e6"/>
  <text x="392" y="774" class="h" style="font-size:18px">The web on the TV</text>
  <text x="392" y="800" class="t">a clean browser (no sign-ins); Llama Prompt Guard 2 reads each page; code reviews every click</text>
  <text x="392" y="818" class="meta">META OPEN WEIGHTS · GPU 1</text>

  <!-- Room arrows -->
  <line x1="306" y1="300" x2="346" y2="300" stroke="#3b4252" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="420" x2="310" y2="420" stroke="#3b4252" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="660" x2="310" y2="660" stroke="#3b4252" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- The cloud -->
  <rect x="1222" y="178" width="346" height="666" rx="22" fill="#fff6ef" stroke="#b4541a" stroke-width="2.5"/>
  <text x="1246" y="214" class="cloudh">THE CLOUD</text>
  <text x="1246" y="240" class="s">Meta Model API, when online</text>

  <rect x="1246" y="262" width="298" height="300" rx="12" fill="#ffffff" stroke="#e5c3a8"/>
  <text x="1264" y="292" class="h" style="font-size:18px">Muse Spark 1.3</text>
  <text x="1264" y="320" class="t">plans searches from hints</text>
  <text x="1264" y="346" class="t">("behind you, on the left")</text>
  <text x="1264" y="372" class="t">requests with several parts</text>
  <text x="1264" y="398" class="t">answers with their sources</text>
  <text x="1264" y="424" class="t">computer use, for the web</text>
  <text x="1264" y="450" class="t">page you asked to see</text>
  <line x1="1264" y1="470" x2="1526" y2="470" stroke="#f0dccb"/>
  <text x="1264" y="498" class="labc">gets: words, and</text>
  <text x="1264" y="522" class="labc">screenshots of web pages</text>
  <text x="1264" y="546" class="meta">META MODEL API</text>

  <rect x="1246" y="580" width="298" height="140" rx="12" fill="#ffffff" stroke="#e5c3a8"/>
  <text x="1264" y="610" class="h" style="font-size:18px">Muse Image 1.0</text>
  <text x="1264" y="638" class="t">pictures from your words;</text>
  <text x="1264" y="664" class="t">the map of your things</text>
  <text x="1264" y="690" class="labc">gets: words only</text>
  <text x="1264" y="710" class="meta">META MODEL API</text>

  <text x="1246" y="760" class="t" style="font-weight:700">Network unplugged?</text>
  <text x="1246" y="786" class="t">Glimmer plans instead,</text>
  <text x="1246" y="812" class="t">on the computer beside the robot.</text>

  <!-- To the cloud -->
  <line x1="1158" y1="470" x2="1240" y2="470" stroke="#b4541a" stroke-width="3" marker-end="url(#arrow-cloud)" stroke-dasharray="8 5"/>
  <line x1="1158" y1="650" x2="1240" y2="650" stroke="#b4541a" stroke-width="3" marker-end="url(#arrow-cloud)" stroke-dasharray="8 5"/>
</svg>
