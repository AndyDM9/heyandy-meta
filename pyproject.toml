[project]
name = "heyandy-meta"
version = "0.0.1"
description = "Andy: a tabletop robot that finds what you've lost and points at it, on Meta's models (Meta's Global AI Developer Hackathon)"
readme = "README.md"
authors = [{ name = "HeyAndy, Inc." }]
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "openai>=1.60",               # the Meta Model API and local llama.cpp/Ollama are OpenAI-compatible
    "meta-sam-parser==0.1.0",     # Meta's SAM 3.1 output parser (SAM License)
    "pillow>=10",                 # crops a found thing for the on-device picture checks
]

[project.urls]
Repository = "https://github.com/AndyDM9/heyandy-meta"
Demo = "https://huggingface.co/spaces/heyandy-ai/andy"

[project.optional-dependencies]
dev = ["pytest", "numpy", "ruff"]  # numpy: the voice code (on the robot it comes with the robot extra)
robot = [
    "reachy-mini==1.12.0rc1",
]
browse = ["playwright>=1.50"]  # Andy uses the web on the TV with Muse Spark's computer use (a clean browser, no sign-ins)

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E9", "B"]  # real mistakes: undefined names, unused imports and variables, likely bugs
ignore = ["B008", "B905"]  # frozen dataclass defaults are safe; zip lengths are equal by construction
