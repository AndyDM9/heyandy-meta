[project]
name = "heyandy-meta"
version = "0.0.1"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "openai>=1.60",               # the Meta Model API and local llama.cpp/Ollama are OpenAI-compatible
    "meta-sam-parser==0.1.0",     # Meta's SAM 3.1 output parser (SAM License)
    "pillow>=10",                 # crops a found thing for the on-device picture checks
]

[project.optional-dependencies]
dev = ["pytest", "numpy"]  # numpy: the voice code, which on the robot comes with the robot extra
robot = [
    "reachy-mini==1.12.0rc1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
