# PipeWire: an output the desktop can always fall back to that isn't the robot's speaker (research.md section 77).
# November 2: the desktop's default output was the monitor's DisplayPort audio; each time the monitor went off or
# switched input, that output vanished and desktop sound fell back to the only other one, the robot's "Reachy Mini
# Audio", which the robot's daemon holds at 16 kHz. Within the second the device refused to switch and jammed: Andy was
# deaf and mute (four times, 08:08 to 08:24). With this silent output present, the fallback lands here instead.
#
# Not installed by default. To install (briefly restarts the desktop's sound, so not between takes):
#   install -D -m 644 deploy/audio/heyandy-desktop-fallback.conf ~/.config/pipewire/pipewire.conf.d/heyandy-desktop-fallback.conf
#   systemctl --user restart pipewire pipewire-pulse wireplumber
#   systemctl --user restart heyandy-robot && sleep 15 && systemctl --user restart heyandy-app
#   uv run python scripts/preflight.py      # READY; then: pactl list short sinks shows "heyandy-desktop-fallback"
# To undo: delete the file and run the same restarts.
context.objects = [
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "heyandy-desktop-fallback"
            node.description = "No sound (keeps the robot's speaker for the robot)"
            media.class      = Audio/Sink
            audio.position   = [ FL FR ]
            priority.session = 2000
            priority.driver  = 2000
        }
    }
]
