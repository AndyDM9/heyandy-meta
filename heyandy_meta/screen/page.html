<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Andy</title>
<style>
  :root { --bg: {{bg}}; --text: {{text}}; --muted: {{muted}}; --accent: {{accent}}; --cloud: {{cloud}}; --outline: {{outline}}; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 500 2.4vw/1.35 system-ui, sans-serif;
         height: 100vh; display: grid; grid-template-rows: auto 1fr auto; padding: 2.5vw 3vw; gap: 2vw; }
  header { display: flex; justify-content: space-between; align-items: center; color: var(--muted); }
  .badge { border: 0.2vw solid currentColor; border-radius: 99px; padding: 0.3vw 1.2vw; font-size: 1.8vw; }
  .badge.cloud { color: var(--cloud); } .badge.device { color: var(--accent); }
  #offline { color: var(--accent); font-weight: 700; }
  #private { font-size: 1.5vw; }
  main { display: grid; place-items: center; min-height: 0; }
  figure { margin: 0; display: grid; gap: 1vw; justify-items: center; max-height: 100%; }
  svg { max-width: 100%; max-height: 62vh; border-radius: 1vw; }
  figcaption { font-size: 3vw; font-weight: 700; color: var(--accent); }
  #caption { font-size: 3.4vw; font-weight: 600; min-height: 2.6em; }
  #why { font-size: 1.6vw; color: var(--muted); }
  #side { display: grid; gap: 1vw; align-content: start; font-size: 1.7vw; color: var(--muted); min-width: 0; }
  #side h2 { margin: 0; font-size: 1.4vw; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  #side ol, #side ul { margin: 0; padding-left: 1.2em; display: grid; gap: 0.4vw; color: var(--text); }
  #timer { font: 700 3.2vw/1 ui-monospace, monospace; color: var(--accent); font-variant-numeric: tabular-nums; }
  #models { display: flex; flex-wrap: wrap; gap: 0.6vw; font-size: 1.4vw; min-height: 2.2vw; }
  #models span { border-radius: 99px; padding: 0.15vw 0.9vw; border: 0.15vw solid currentColor; }
  #models .device { color: var(--accent); } #models .cloud { color: var(--cloud); }
  #models b { font-weight: 600; color: var(--muted); }
  .stage { display: grid; grid-template-columns: 1fr minmax(0, 28vw); gap: 2vw; min-height: 0; }
</style>
</head>
<body>
<header><span>Andy, a robot <small id="private">· pictures and voice stay on this computer</small></span><span id="offline" hidden>Offline: working on this computer</span><span id="badge" class="badge" hidden></span></header>
<div class="stage"><main id="main"></main><aside id="side" aria-live="polite"></aside></div>
<footer><div id="caption" aria-live="polite"></div><div id="why"></div><div id="models" aria-label="Models on this turn"></div></footer>
<script>
  const $ = (id) => document.getElementById(id);
  const svgNS = "http://www.w3.org/2000/svg";
  let shown = "";
  // Zoom to the found thing: about four times its size, at least a third of the frame, in the frame's shape.
  function zoom(p) {
    const [l, t, r, b] = p.box, aspect = p.width / p.height;
    let w = Math.max((r - l) * 4, (b - t) * 4 * aspect, p.width / 3);
    w = Math.min(w, p.width);
    const h = w / aspect;
    const x = Math.min(Math.max((l + r) / 2 - w / 2, 0), p.width - w);
    const y = Math.min(Math.max((t + b) / 2 - h / 2, 0), p.height - h);
    return [x, y, w, h].map(Math.round);
  }
  function list(tag, items) {
    const el = document.createElement(tag);
    for (const it of items) { const li = document.createElement("li"); li.textContent = it; el.append(li); }
    return el;
  }
  function side(s) {
    const aside = $("side");
    aside.replaceChildren();
    if (s.seconds !== null) {
      const t = document.createElement("div"); t.id = "timer";
      t.textContent = s.seconds.toFixed(1) + " s" + (s.running ? "" : " ✓");
      aside.append(t);
    }
    const add = (title, el) => { const h = document.createElement("h2"); h.textContent = title; aside.append(h, el); };
    if (s.steps && s.steps.length) add("Andy's plan", list("ol", s.steps));
    if (s.memory) add("What I remember", list("ul", s.memory.length ? s.memory : ["Nothing yet."]));
    if (s.sources && s.sources.length) add("Sources", list("ul", s.sources.map(x => x.title + " · " + new URL(x.url).hostname.replace(/^www\./, ""))));
  }
  function models(list) {
    const el = $("models");
    el.replaceChildren();
    for (const where of ["device", "cloud"]) {
      const these = (list || []).filter(m => m.where === where);
      if (!these.length) continue;
      const b = document.createElement("b");
      b.textContent = where === "device" ? "On this computer:" : "In the cloud (words only):";
      el.append(b);
      for (const m of these) {
        const chip = document.createElement("span");
        chip.className = where;
        chip.textContent = m.name + (m.times > 1 ? " ×" + m.times : "");
        el.append(chip);
      }
    }
  }
  function render(s) {
    side(s);
    models(s.models);
    $("caption").textContent = s.caption || "";
    $("offline").hidden = s.online;
    const b = $("badge");
    b.hidden = !s.source;
    b.className = "badge " + (s.source || "");
    b.textContent = s.source === "cloud" ? "Muse Spark in the cloud: words only" : "On this computer";
    $("why").textContent = s.reason ? "Why: " + s.reason : "";
    const p = s.picture, key = p ? p.src.length + ":" + p.box.join(",") : "";
    if (key === shown) return;
    shown = key;
    const main = $("main");
    main.replaceChildren();
    if (!p) return;
    const fig = document.createElement("figure");
    const svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("viewBox", zoom(p).join(" "));
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", `Where Andy saw the ${p.label}`);
    const img = document.createElementNS(svgNS, "image");
    img.setAttribute("href", p.src); img.setAttribute("width", p.width); img.setAttribute("height", p.height);
    svg.append(img);
    if (p.outline) {
      const path = document.createElementNS(svgNS, "path");
      path.setAttribute("d", p.outline);
      path.setAttribute("transform", `translate(${p.box[0]} ${p.box[1]}) scale(${p.scale[0]} ${p.scale[1]})`);
      path.setAttribute("fill", "none"); path.setAttribute("stroke", "var(--outline)");
      path.setAttribute("stroke-width", "4"); path.setAttribute("vector-effect", "non-scaling-stroke");
      svg.append(path);
    }
    const cap = document.createElement("figcaption");
    cap.textContent = p.words;
    fig.append(svg, cap);
    main.append(fig);
  }
  async function tick() {
    try { render(await (await fetch("/state.json", { cache: "no-store" })).json()); } catch (e) {}
    setTimeout(tick, 500);
  }
  tick();
</script>
</body>
</html>
