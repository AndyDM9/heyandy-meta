<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Andy Finder</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>What should I find?</h1>
    <form id="ask"><label for="thing">A thing in the room</label>
      <div class="row"><input id="thing" placeholder="glasses, keys, the remote" autocomplete="off" required><button>Find it</button></div>
    </form>
    <p id="status" role="status" aria-live="polite">Ready.</p>
    <p class="where">Pictures go to: <b id="where">...</b></p>
  </main>
  <script src="/static/main.js"></script>
</body>
</html>
