[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "andy_finder"
version = "0.2.0"
description = "Reachy Mini turns to your ringing phone (nothing to set up), and finds what you've lost with SAM 3.1."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["reachy-mini", "numpy", "pillow", "openai>=1.60", "meta-sam-parser"]
keywords = ["reachy-mini-app"]

[project.entry-points."reachy_mini_apps"]
andy_finder = "andy_finder.main:AndyFinder"

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
andy_finder = ["**/*"]
